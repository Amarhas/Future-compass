    <rect x="28" y="36" width="80" height="48" rx="18" fill="#d9fbf7" stroke="#32c8c0" stroke-width="7"/>
    <rect x="30" y="122" width="76" height="34" rx="10" fill="#e9e7ff" stroke="#7b4dff" stroke-width="5"/>
    <text x="68" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#243042">SAVE</text>
    <path d="M34 188 H102" stroke="#5b6cff" stroke-width="12" stroke-linecap="round"/>
